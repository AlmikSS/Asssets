name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'Assets/_KofeyekToolkit/_Scripts/**'
      - 'Packages/manifest.json'
      - 'ProjectSettings/ProjectVersion.txt'
  pull_request:
    paths:
      - 'website/**'
      - 'Assets/_KofeyekToolkit/_Scripts/**'
      - 'Packages/manifest.json'
      - 'ProjectSettings/ProjectVersion.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen
      - name: Install documentation dependencies
        working-directory: website
        run: npm ci
      - name: Generate API and build documentation
        working-directory: website
        run: npm run docs:check
      - name: Verify generated API entry point
        run: test -f website/build/api/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: website/build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
